<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mushfiqur Rahman Faiyaz, AI engineer in the making">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0820"/>
    <stop offset="0.55" stop-color="#241058"/>
    <stop offset="1" stop-color="#4c1d95"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c4b5fd"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
</defs>
<style>
  .name { font: 800 56px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
  .tag { font: 600 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#accent); }
  .mono { font: 500 17px 'Courier New', Consolas, monospace; fill: #c4b5fd; }
  .edge { stroke: #a78bfa; stroke-width: 1; stroke-opacity: 0.18; animation: edge 3.2s ease-in-out infinite; }
  .node { fill: #c4b5fd; animation: node 2.8s ease-in-out infinite; }
  .up1 { animation: up 0.9s 0.1s ease-out both; }
  .up2 { animation: up 0.9s 0.4s ease-out both; }
  .up3 { animation: up 0.9s 0.7s ease-out both; }
  .cursor { animation: blink 1s steps(1) infinite; }
  .bar { transform-origin: 70px 0; animation: grow 1.2s 0.6s ease-out both; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes edge { 0%,100% { stroke-opacity: 0.12; } 50% { stroke-opacity: 0.6; } }
  @keyframes node { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="980" cy="70" r="120" fill="#7c3aed" opacity="0.5" filter="url(#blur)">
    <animate attributeName="cx" values="980;1040;980" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="300" r="130" fill="#22d3ee" opacity="0.18" filter="url(#blur)">
    <animate attributeName="cy" values="300;250;300" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g>
    <line x1="830" y1="85" x2="935" y2="65" class="edge" style="animation-delay:0.00s"/>
<line x1="830" y1="85" x2="935" y2="125" class="edge" style="animation-delay:0.35s"/>
<line x1="830" y1="85" x2="935" y2="195" class="edge" style="animation-delay:0.70s"/>
<line x1="830" y1="85" x2="935" y2="255" class="edge" style="animation-delay:1.05s"/>
<line x1="830" y1="160" x2="935" y2="65" class="edge" style="animation-delay:1.40s"/>
<line x1="830" y1="160" x2="935" y2="125" class="edge" style="animation-delay:1.75s"/>
<line x1="830" y1="160" x2="935" y2="195" class="edge" style="animation-delay:2.10s"/>
