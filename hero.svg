<line x1="830" y1="235" x2="935" y2="65" class="edge" style="animation-delay:2.80s"/>
<line x1="830" y1="235" x2="935" y2="125" class="edge" style="animation-delay:0.00s"/>
<line x1="830" y1="235" x2="935" y2="195" class="edge" style="animation-delay:0.35s"/>
<line x1="830" y1="235" x2="935" y2="255" class="edge" style="animation-delay:0.70s"/>
<line x1="935" y1="65" x2="1040" y2="100" class="edge" style="animation-delay:1.05s"/>
<line x1="935" y1="65" x2="1040" y2="160" class="edge" style="animation-delay:1.40s"/>
<line x1="935" y1="65" x2="1040" y2="220" class="edge" style="animation-delay:1.75s"/>
<line x1="935" y1="125" x2="1040" y2="100" class="edge" style="animation-delay:2.10s"/>
<line x1="935" y1="125" x2="1040" y2="160" class="edge" style="animation-delay:2.45s"/>
<line x1="935" y1="125" x2="1040" y2="220" class="edge" style="animation-delay:2.80s"/>
<line x1="935" y1="195" x2="1040" y2="100" class="edge" style="animation-delay:0.00s"/>
<line x1="935" y1="195" x2="1040" y2="160" class="edge" style="animation-delay:0.35s"/>
<line x1="935" y1="195" x2="1040" y2="220" class="edge" style="animation-delay:0.70s"/>
<line x1="935" y1="255" x2="1040" y2="100" class="edge" style="animation-delay:1.05s"/>
<line x1="935" y1="255" x2="1040" y2="160" class="edge" style="animation-delay:1.40s"/>
<line x1="935" y1="255" x2="1040" y2="220" class="edge" style="animation-delay:1.75s"/>
<line x1="1040" y1="100" x2="1130" y2="160" class="edge" style="animation-delay:2.10s"/>
<line x1="1040" y1="160" x2="1130" y2="160" class="edge" style="animation-delay:2.45s"/>
<line x1="1040" y1="220" x2="1130" y2="160" class="edge" style="animation-delay:2.80s"/>
    <circle cx="830" cy="85" r="6" class="node" style="animation-delay:0.00s"/>
<circle cx="830" cy="160" r="6" class="node" style="animation-delay:0.40s"/>
<circle cx="830" cy="235" r="6" class="node" style="animation-delay:0.80s"/>
<circle cx="935" cy="65" r="6" class="node" style="animation-delay:1.20s"/>
<circle cx="935" cy="125" r="6" class="node" style="animation-delay:1.60s"/>
<circle cx="935" cy="195" r="6" class="node" style="animation-delay:2.00s"/>
<circle cx="935" cy="255" r="6" class="node" style="animation-delay:2.40s"/>
<circle cx="1040" cy="100" r="6" class="node" style="animation-delay:0.00s"/>
<circle cx="1040" cy="160" r="6" class="node" style="animation-delay:0.40s"/>
<circle cx="1040" cy="220" r="6" class="node" style="animation-delay:0.80s"/>
<circle cx="1130" cy="160" r="9" class="node" style="animation-delay:1.20s"/>
  </g>
  <text x="70" y="140" class="name up1">Mushfiqur Rahman Faiyaz</text>
  <rect x="70" y="162" width="120" height="4" rx="2" fill="url(#accent)" class="bar"/>
  <text x="70" y="212" class="tag up2">AI Engineer in the making  ·  Data Science  ·  Builder</text>
  <text x="70" y="262" class="mono up3">$ building RAG systems, apps &amp; tools</text>
  <rect x="444" y="249" width="9" height="17" fill="#c4b5fd" class="cursor"/>
</g>
</svg>
